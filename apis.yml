x-coverage:
  state: covered
  reason: covered
  detail: >-
    Five institution-operated machine surfaces were found and verified live on 2026-08-30: a
    keyless VuFind 11.0.4 REST API on catalog.lib.msu.edu whose OpenAPI 3.0.3 MSU publishes
    itself at /api/v1/?swagger (re-fetched and compared against openapi/_original — info, all
    six paths and all 17 component schemas match exactly), two OAI-PMH 2.0 providers, and a
    Shibboleth SAML 2.0 IdP registered in InCommon as urn:mace:incommon:msu.edu. Three
    education-regime domain standards are evidenced from those endpoints — oai-pmh,
    shibboleth, saml. Two vendor platforms are recorded as tenant relationships rather than as
    MSU contracts, and neither vendor's spec is saved here: D2L Brightspace (DNS CNAME
    d2l.msu.edu -> msu.brightspace.com) and Academic Analytics (Scholars @ MSU). No Figshare,
    Pure, Ex Libris, Dataverse or Symplectic tenancy could be confirmed — msu.figshare.com and
    michigan-state.figshare.com both answer 202 with an empty body, which is figshare's
    wildcard behaviour and not evidence of an MSU tenant, so none is claimed. What MSU does
    not have: no developer portal, no API key issuance, no OAuth authorization server, no
    changelog, no status page, no deprecation policy, no open data portal (data.msu.edu does
    not resolve), and no public course-catalog or registrar API. Two probe hazards on this
    institution, both recorded in errors/: msu.edu and tech.msu.edu sit behind Imperva, which
    returns HTTP 200 with a JavaScript challenge for EVERY path including nonsense ones, so a
    200 from those hosts proves nothing — page existence here was confirmed from
    msu.edu/sitemap.xml instead; and catalog.lib.msu.edu / d.lib.msu.edu front their HTML with
    a go-away bot filter that answers 418, while leaving /api/v1 and the OAI endpoints open.
    One genuine contradiction worth naming: MSU publishes /.well-known/ai.txt declaring three
    AI-Endpoints (msu.edu/ai/summary.json, /ai/faq.json, /ai/service.json) and an
    llms.txt pointing at sitemap-llm.xml, but the Imperva edge serves a JS challenge instead
    of JSON to every one of those endpoints, and sitemap-llm.xml is an empty urlset. The
    stated agent policy and the deployed edge behaviour disagree.
