- aid: michigan-state-university:idp
  name: MSU Identity Provider (Shibboleth / SAML 2.0)
  x-operator: institution
  description: >-
    MSU's federated single sign-on. The Shibboleth Identity Provider publishes SAML 2.0
    metadata unauthenticated at idp.idm.msu.edu/idp/shibboleth — verified live on 2026-08-30,
