aid: michigan-state-university
name: Michigan State University
x-type: university
x-category: Public Research University
description: >-
  Michigan State University is a public land-grant research university in East Lansing,
  Michigan, and a founding member of the Big Ten and the AAU. It runs no central developer
  portal, issues no API keys, and operates no self-service onboarding of any kind, and this
  profile does not pretend otherwise. What it genuinely operates, on its own msu.edu hosts,
  is a small set of real machine surfaces run by MSU Libraries and MSU IT: a keyless VuFind
  11.0.4 REST API for the library discovery index at catalog.lib.msu.edu/api/v1, whose
  OpenAPI 3.0.3 the university itself publishes live at /api/v1/?swagger; two OAI-PMH 2.0
  providers, one over the catalog and one over the digital repository at d.lib.msu.edu, the
  latter running oai_repo — an OAI-PMH server library MSU Libraries wrote themselves and
  release Apache-2.0 on GitHub, which is real institutional engineering rather than a vendor
  deployment; and a Shibboleth SAML 2.0 identity provider registered in InCommon as
  urn:mace:incommon:msu.edu. MSU also publishes an llms.txt and a /.well-known/ai.txt naming
  three AI content endpoints, though the Imperva edge in front of msu.edu answers every
  non-browser client with a JavaScript challenge, so those declared endpoints are not
  actually reachable by the agents they are addressed to. Two vendor platforms are recorded
  as tenant relationships rather than as MSU contracts: D2L Brightspace (d2l.msu.edu, CNAME
  msu.brightspace.com) and Academic Analytics (Scholars @ MSU at scholars.msu.edu). Student
  records, registration, HR and finance are behind institutional SSO and are not public APIs.
