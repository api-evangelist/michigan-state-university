stability_assessment:
  level: informal
  detail: >-
    These are library infrastructure endpoints operated for institutional purposes and
    harvest partners, not a productised API programme. They have been stable in practice,
    but MSU has made no public commitment to keep them so and has published no way to find
    out when they change.
